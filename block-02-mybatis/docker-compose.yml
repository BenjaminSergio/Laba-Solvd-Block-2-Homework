services:
  mysql:
    image: mysql:8.4
    container_name: airline_booking_mysql_mybatis
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: airline_booking
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - airline_booking_data:/var/lib/mysql

volumes:
  airline_booking_data:
