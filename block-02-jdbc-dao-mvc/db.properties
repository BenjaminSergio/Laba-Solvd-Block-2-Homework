# JDBC connection settings — read by ConnectionPool at startup.
# Anatomy of the URL: jdbc:<vendor>://<host>:<port>/<database>?<flags>
db.url=jdbc:mysql://localhost:3306/airline_booking?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8
db.user=root
db.password=root

# Pool sizing — your L12 ConnectionPool reads these.
pool.size=10
pool.acquire.timeout.ms=2000

# Default isolation level for borrowed connections.
# Allowed: READ_UNCOMMITTED | READ_COMMITTED | REPEATABLE_READ | SERIALIZABLE
db.isolation=REPEATABLE_READ
